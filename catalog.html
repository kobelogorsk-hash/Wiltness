<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог | Дом Быта</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏠</text></svg>">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <header>
        <div class="logo"><i class="fa-solid fa-house-chimney"></i> Дом Быта</div>
        <nav>
            <ul>
                <li><a href="index.html">Главная</a></li>
                <li><a href="catalog.html" class="active">Каталог</a></li>
                <li><a href="services.html">Услуги</a></li>
                <li><a href="about.html">О нас</a></li>
                <li><a href="contacts.html">Контакты</a></li>
            </ul>
        </nav>
        <div class="cart-icon-wrapper">
            <i class="fa-solid fa-cart-shopping fa-lg"></i>
            <span class="cart-count">0</span>
        </div>
    </header>

    <div class="page-header">
        <h1>Каталог товаров</h1>
        <p style="color:var(--secondary-color);">Выберите категорию или просмотрите все товары</p>
    </div>

    <div class="container">
        <div class="filters">
            <!-- Кнопки фильтров генерируются JS -->
        </div>

        <div class="products-grid" id="catalog-products">
            <!-- Товары -->
        </div>
    </div>

    <footer>
        <p>&copy; 2024 Дом Быта. Все права защищены.</p>
        <p class="author-name">Разработчик: Амет</p>
    </footer>

    <!-- Модальное окно корзины -->
    <div id="cartModal" class="modal">
        <div class="modal-content glass-panel">
            <span class="close-modal">&times;</span>
            <h2>Ваша корзина</h2>
            <div class="cart-items"></div>
            <div class="promo-section">
                <label>Есть промокод?</label>
                <div class="promo-input-group">
                    <input type="text" id="promoCode" placeholder="Введите код">
                    <button id="applyPromo" class="apply-promo-btn">OK</button>
                </div>
                <p id="promoMessage" style="font-size:0.9rem; margin-top:5px; height:1.2em;"></p>
            </div>
            <div class="payment-methods">
                <div class="payment-badge"><i class="fa-solid fa-qrcode"></i> СБП</div>
                <div class="payment-badge"><i class="fa-brands fa-yandex"></i> Yandex Pay</div>
                <div class="payment-badge"><i class="fa-regular fa-credit-card"></i> Карты РФ</div>
            </div>
            <div class="total-price" id="totalPrice">Итого: 0 ₽</div>
            <button class="checkout-btn">Оформить заказ</button>
        </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/main.js"></script>
    <script>
        // Логика каталога
        const catalogContainer = document.getElementById('catalog-products');
        const filtersContainer = document.querySelector('.filters');

        function renderProducts(filter = 'all') {
            catalogContainer.innerHTML = '';
            const filtered = filter === 'all' 
                ? products 
                : products.filter(p => p.category === filter);

            filtered.forEach(product => {
                const stars = '★'.repeat(Math.floor(product.rating || 5));
                const card = document.createElement('div');
                card.className = 'product-card glass-panel';
                card.innerHTML = `
                    <img src="${product.image}" alt="${product.title}">
                    <h3 class="product-title">${product.title}</h3>
                    <div class="product-rating" style="margin-bottom:8px;">
                        <span class="stars" style="color:var(--warning-color);">${stars}</span>
                        <span style="font-size:0.85rem; color:var(--secondary-color);">(${product.reviews || 0})</span>
                    </div>
                    <p style="font-size:0.9rem; margin-bottom:10px; color:var(--secondary-color);">${product.description.substring(0, 70)}...</p>
                    <div class="product-price">${product.price} ₽</div>
                    <button class="add-to-cart-btn" onclick="addToCart(${product.id})">В корзину</button>
                `;
                catalogContainer.appendChild(card);
            });
        }

        function renderFilters() {
            filtersContainer.innerHTML = '';
            categories.forEach(cat => {
                const btn = document.createElement('button');
                btn.className = `filter-btn ${cat.id === 'all' ? 'active' : ''}`;
                btn.textContent = cat.name;
                btn.onclick = () => {
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    renderProducts(cat.id);
                };
                filtersContainer.appendChild(btn);
            });
        }

        renderFilters();
        renderProducts();
    </script>
</body>
</html>
