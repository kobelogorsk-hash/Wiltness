<body>
    <header class="glass-panel">
        <div class="logo"><i class="fa-solid fa-house-chimney"></i> Дом Быта</div>
        <nav><ul><li><a href="index.html">Главная</a></li><li><a href="catalog.html">Каталог</a></li><li><a href="about.html">О нас</a></li><li><a href="contacts.html">Контакты</a></li></ul></nav>
        <div class="cart-icon-wrapper"><i class="fa-solid fa-cart-shopping fa-lg"></i><span class="cart-count">0</span></div>

    <div class="container">

            <div style="margin-top:30px;">

            <form style="margin-top:30px; display:flex; flex-direction:column; gap:15px;">

                <textarea rows="4" placeholder="Сообщение" style="padding:15px; border-radius:10px; border:none; background:rgba(255,255,255,0.2); color:white; resize:none;"></textarea>
                <button type="submit" class="add-to-cart-btn">Отправить</button>
            </form>
        </div>
    </div>

    <footer class="glass-panel">
