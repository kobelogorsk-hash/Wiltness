<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Контакты | Дом Быта</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏠</text></svg>">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header>
        <div class="logo"><i class="fa-solid fa-house-chimney"></i> Дом Быта</div>
        <nav>
            <ul>
                <li><a href="index.html">Главная</a></li>
                <li><a href="catalog.html">Каталог</a></li>
                <li><a href="services.html">Услуги</a></li>
                <li><a href="about.html">О нас</a></li>
                <li><a href="contacts.html" class="active">Контакты</a></li>
            </ul>
        </nav>
        <div class="cart-icon-wrapper"><i class="fa-solid fa-cart-shopping fa-lg"></i><span class="cart-count">0</span></div>
    </header>

    <div class="page-header">
        <h1>Контакты</h1>
        <p style="color:var(--secondary-color);">Свяжитесь с нами любым удобным способом</p>
    </div>

    <div class="container">
        <div class="glass-panel" style="padding:40px; max-width:700px; margin:0 auto;">
            <div style="text-align:center; margin-bottom:30px;">
                <p style="font-size:1.1rem; margin-bottom:15px;"><i class="fa-solid fa-phone" style="color:var(--primary-color);"></i> +7 (999) 000-00-00</p>
                <p style="font-size:1.1rem; margin-bottom:15px;"><i class="fa-solid fa-envelope" style="color:var(--primary-color);"></i> support@dombyta.ru</p>
                <p style="font-size:1.1rem;"><i class="fa-solid fa-location-dot" style="color:var(--primary-color);"></i> г. Москва, ул. Примерная, д. 10</p>
            </div>
            <form onsubmit="event.preventDefault(); alert('Сообщение отправлено! Мы свяжемся с вами в ближайшее время.');">
                <div class="form-group">
                    <label>Ваше имя</label>
                    <input type="text" placeholder="Иван Иванов" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" placeholder="example@mail.ru" required>
                </div>
                <div class="form-group">
                    <label>Сообщение</label>
                    <textarea rows="5" placeholder="Ваш вопрос или предложение..." required></textarea>
                </div>
                <button type="submit" class="submit-btn">Отправить</button>
            </form>
        </div>
    </div>

    <footer>
        <p>&copy; 2024 Дом Быта. Все права защищены.</p>
        <p class="author-name">Разработчик: Амет</p>
    </footer>
    <script src="js/data.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
